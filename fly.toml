# fly.toml app configuration file generated for access-api-shimmering-flower-7003 on 2026-05-18T14:59:17+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'access-api-shimmering-flower-7003'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PROVIDER = 'postgres'
  PG_SCHEMA = 'public'
  PG_SSL = 'true'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
