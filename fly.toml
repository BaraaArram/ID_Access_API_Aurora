# fly.toml app configuration file generated for id-access-api-aurora on 2026-06-16T07:25:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'id-access-api-aurora'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PROVIDER = 'postgres'
  PG_SCHEMA = 'public'
  PG_SSL = 'true'
  PORT = '8080'
  TOKEN_API_URL = 'https://token-api-mellowed-skylark.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
